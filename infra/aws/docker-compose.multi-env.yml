services:
  postgres:
    image: postgres:16-alpine
    container_name: recruiterreply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
    volumes:
      # Deploys run this file from a throwaway temp dir, so the data dir must be an absolute, persistent path.
      - ${POSTGRES_DATA_DIR:-/home/ubuntu/recruiterreply/data/postgres}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - recruiterreply
    ports:
      - "127.0.0.1:5433:5432"

  backend-dev:
    image: ${BACKEND_IMAGE_DEV:-178522450316.dkr.ecr.us-east-1.amazonaws.com/recruiterreply-backend:dev-latest}
    container_name: recruiterreply-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      AWS_REGION: us-east-1
      AWS_SECRETS_MANAGER_SECRET_NAME: recruiterreply/dev/backend-app-secrets
      LEGACY_AUTH_ENABLED: "true"
      Jwt__Key: ${JWT_KEY_DEV}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # The Dev API is private; send OAuth callbacks through the authenticated
      # same-origin CloudFront behavior so it can add X-RR-Origin-Auth.
      Google__RedirectUri: https://dev.recruiterreply.com/api/auth/google/callback
      Frontend__BaseUrl: https://dev.recruiterreply.com
      Cors__AllowedOrigins__0: https://dev.recruiterreply.com
      GitHubActionsOidc__Enabled: "true"
      GitHubActionsOidc__Issuer: https://token.actions.githubusercontent.com
      GitHubActionsOidc__Audience: recruiterreply-dev-smoke
      GitHubActionsOidc__Repository: moojjoo/recruiterreply
      GitHubActionsOidc__WorkflowRef: moojjoo/recruiterreply/.github/workflows/promote.yml@refs/heads/main
      GitHubActionsOidc__Ref: refs/heads/main
      GitHubActionsOidc__Environment: dev
      PrivateApiOriginAuth__Enabled: "true"
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=recruiterreply_dev;Username=${POSTGRES_SUPERUSER};Password=${POSTGRES_SUPERPASS}
    volumes:
      - recruiterreply-dev-dataprotection-keys:/app/keys
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - recruiterreply
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "false"
        awslogs-group: /recruiterreply/dev/backend
        awslogs-stream: backend-dev

  backend-test:
    image: ${BACKEND_IMAGE_TEST:-178522450316.dkr.ecr.us-east-1.amazonaws.com/recruiterreply-backend:test-latest}
    container_name: recruiterreply-backend-test
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://0.0.0.0:5000
      AWS_REGION: us-east-1
      AWS_SECRETS_MANAGER_SECRET_NAME: recruiterreply/test/backend-app-secrets
      Jwt__Key: ${JWT_KEY_TEST}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Google__RedirectUri: https://test.recruiterreply.com/api/auth/google/callback
      Frontend__BaseUrl: https://test.recruiterreply.com
      Cors__AllowedOrigins__0: https://test.recruiterreply.com
      PrivateApiOriginAuth__Enabled: "true"
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=recruiterreply_test;Username=${POSTGRES_SUPERUSER};Password=${POSTGRES_SUPERPASS}
    ports:
      - "127.0.0.1:5002:5000"
    networks:
      - recruiterreply
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "false"
        awslogs-group: /recruiterreply/test/backend
        awslogs-stream: backend-test

  backend-prod:
    image: ${BACKEND_IMAGE_PROD:-178522450316.dkr.ecr.us-east-1.amazonaws.com/recruiterreply-backend:prod-latest}
    container_name: recruiterreply-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      AWS_REGION: us-east-1
      AWS_SECRETS_MANAGER_SECRET_NAME: recruiterreply/prod/backend-app-secrets
      Google__RedirectUri: https://api.recruiterreply.com/api/auth/google/callback
      Frontend__BaseUrl: https://recruiterreply.com
      Cors__AllowedOrigins__0: https://recruiterreply.com
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=recruiterreply_prod;Username=${POSTGRES_SUPERUSER};Password=${POSTGRES_SUPERPASS}
    ports:
      - "127.0.0.1:5003:5000"
    networks:
      - recruiterreply
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "false"
        awslogs-group: /recruiterreply/prod/backend
        awslogs-stream: backend-prod

networks:
  recruiterreply:
    name: recruiterreply
volumes:
  recruiterreply-dev-dataprotection-keys:
    name: recruiterreply-dev-dataprotection-keys
