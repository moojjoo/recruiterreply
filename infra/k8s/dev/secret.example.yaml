apiVersion: v1
kind: Secret
metadata:
  name: recruiterreply-backend-secrets
  namespace: recruiterreply-dev
type: Opaque
stringData:
  Postgres__Password: REPLACE_WITH_STRONG_DB_PASSWORD
  ConnectionStrings__DefaultConnection: Host=recruiterreply-postgres;Port=5432;Database=recruiterreply_dev;Username=recruiterreply_dev;Password=REPLACE_WITH_STRONG_DB_PASSWORD
  OpenAI__ApiKey: REPLACE_WITH_REAL_OPENAI_KEY
  Jwt__Key: REPLACE_WITH_32_CHAR_OR_LONGER_SECRET
