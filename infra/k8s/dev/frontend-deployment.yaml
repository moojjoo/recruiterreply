apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiterreply-frontend
  namespace: recruiterreply-dev
  labels:
    app: recruiterreply-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruiterreply-frontend
  template:
    metadata:
      labels:
        app: recruiterreply-frontend
    spec:
      containers:
        - name: frontend
          image: recruiterreply-frontend:dev-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
