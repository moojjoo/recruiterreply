name: Promote to Test

on:
  workflow_dispatch:

permissions:
  actions: read
  id-token: write
  contents: read
  deployments: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Select latest successful dev deployment
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const environment = 'dev';
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment, per_page: 100
            });
            for (const deployment of deployments) {
              if (!/^[a-f0-9]{40}$/.test(deployment.sha)) continue;
              const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 100
              });
              // Only the latest status is authoritative; never select an older success
              // if the same deployment was subsequently marked failed/inactive.
              if (statuses[0]?.state !== 'success') continue;
              core.info(`Selected ${environment} deployment ${deployment.id} SHA ${deployment.sha}`);
              core.setOutput('sha', deployment.sha);
              return;
            }
            core.setFailed(`No successful ${environment} deployment with a full SHA was found. Refusing promotion.`);

  preflight-backend-image:
    needs: resolve-source
    runs-on: ubuntu-latest
    # AWS_ROLE_TO_ASSUME is scoped to the GitHub test environment.
    # This job must use that environment to access its variables and protections.
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate Test AWS OIDC configuration
        env:
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$ROLE_TO_ASSUME" ]]; then
            echo "::error::Missing AWS role ARN in GitHub test environment. Configure AWS_ROLE_TO_ASSUME (or AWS_ROLE_ARN) under Settings > Environments > test."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      - name: Require immutable backend image for approved Dev SHA
        env:
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name recruiterreply-backend --image-ids "imageTag=$SHA" --query 'imageDetails[0].imageDigest' --output text; then
            echo "::error::Dev deployment SHA $SHA has no backend image in ECR. Do not promote; restore the original image or approve a new complete Dev release."
            exit 1
          fi

  promote:
    needs: [resolve-source, preflight-backend-image]
    concurrency:
      group: promote-test
      cancel-in-progress: false
    uses: ./.github/workflows/promote.yml
    with:
      environment: test
      sha: ${{ needs.resolve-source.outputs.sha }}
      api_base_url: https://api-test.recruiterreply.com/api
      frontend_url: https://test.recruiterreply.com
      api_url: https://api-test.recruiterreply.com
      robots_txt: |
        User-agent: *
        Disallow: /
