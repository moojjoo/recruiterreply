name: Lighthouse SEO Baseline
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run mobile Lighthouse baseline
        run: |
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun --config=../.lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-baseline
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
