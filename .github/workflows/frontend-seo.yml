name: Frontend SEO Validation
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-seo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:seo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-seo-build
          path: frontend/dist/
          retention-days: 7
