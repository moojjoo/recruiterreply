name: Promote Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
      api_base_url:
        required: true
        type: string
      frontend_url:
        required: true
        type: string
      api_url:
        required: true
        type: string
      robots_txt:
        required: true
        type: string

permissions:
  actions: read
  id-token: write
  contents: read

env:
  BACKEND_IMAGE_NAME: recruiterreply-backend
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/recruiterreply' }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Resolve AWS auth inputs
        id: aws-auth
        env:
          ROLE_FROM_VARS: ${{ vars.AWS_ROLE_TO_ASSUME }}
          ROLE_FROM_SECRETS: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          ROLE_ARN_FROM_VARS: ${{ vars.AWS_ROLE_ARN }}
          ROLE_ARN_FROM_SECRETS: ${{ secrets.AWS_ROLE_ARN }}
          KEY_FROM_VARS: ${{ vars.AWS_ACCESS_KEY_ID }}
          KEY_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_ALIAS_FROM_VARS: ${{ vars.AWS_ACCESS_KEY }}
          KEY_ALIAS_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY }}
          SECRET_FROM_VARS: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_ALIAS_FROM_VARS: ${{ vars.AWS_SECRET_KEY }}
          SECRET_ALIAS_FROM_SECRETS: ${{ secrets.AWS_SECRET_KEY }}
          TOKEN_FROM_VARS: ${{ vars.AWS_SESSION_TOKEN }}
          TOKEN_FROM_SECRETS: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          ROLE_TO_ASSUME="${ROLE_FROM_VARS:-${ROLE_FROM_SECRETS:-${ROLE_ARN_FROM_VARS:-${ROLE_ARN_FROM_SECRETS:-}}}}"
          AWS_ACCESS_KEY_ID_VAL="${KEY_FROM_VARS:-${KEY_FROM_SECRETS:-${KEY_ALIAS_FROM_VARS:-${KEY_ALIAS_FROM_SECRETS:-}}}}"
          AWS_SECRET_ACCESS_KEY_VAL="${SECRET_FROM_SECRETS:-${SECRET_FROM_VARS:-${SECRET_ALIAS_FROM_SECRETS:-${SECRET_ALIAS_FROM_VARS:-}}}}"
          AWS_SESSION_TOKEN_VAL="${TOKEN_FROM_SECRETS:-${TOKEN_FROM_VARS:-}}"

          if [[ -n "$ROLE_TO_ASSUME" ]]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            echo "role_to_assume=$ROLE_TO_ASSUME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" && -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then
            echo "auth_mode=keys" >> "$GITHUB_OUTPUT"
            echo "aws_access_key_id=$AWS_ACCESS_KEY_ID_VAL" >> "$GITHUB_OUTPUT"
            echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY_VAL" >> "$GITHUB_OUTPUT"
            if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then
              echo "aws_session_token=$AWS_SESSION_TOKEN_VAL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "::error::Missing AWS auth config. Provide either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY."
          exit 1

      - name: Configure AWS credentials (OIDC role)
        if: steps.aws-auth.outputs.auth_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.aws-auth.outputs.role_to_assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.aws-auth.outputs.auth_mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.aws-auth.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.aws-auth.outputs.aws_secret_access_key }}
          aws-session-token: ${{ steps.aws-auth.outputs.aws_session_token }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment identifiers
        id: env-ids
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ENV_UPPER=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          echo "backend_service=backend-$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "backend_image_var=BACKEND_IMAGE_${ENV_UPPER}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image exists in ECR
        id: verify-backend
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name "$BACKEND_IMAGE_NAME" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "::error::No backend image found in ECR for SHA $SHA. Run the Build (Dev) workflow on that commit first."
            exit 1
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "backend_image=$ECR_REGISTRY/$BACKEND_IMAGE_NAME:$SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve successful build run
        id: build-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          RUN_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&per_page=20" \
            | jq -r --arg current_run_id "$CURRENT_RUN_ID" '.workflow_runs | map(select(.path == ".github/workflows/build.yml" and (.conclusion == "success" or .id == ($current_run_id | tonumber)))) | first | .id // empty')

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No Build (Dev) workflow run with artifacts found for SHA $SHA."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ inputs.sha }}
          path: promoted-dist
          run-id: ${{ steps.build-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Apply environment configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          ROBOTS_TXT: ${{ inputs.robots_txt }}
        run: |
          set -euo pipefail
          if [[ ! -f promoted-dist/config.js ]]; then
            echo "::error::promoted-dist/config.js missing from artifact"
            exit 1
          fi
          sed -i "s|__RUNTIME_API_BASE_URL__|${API_BASE_URL}|" promoted-dist/config.js
          printf '%s\n' "$ROBOTS_TXT" > promoted-dist/robots.txt

      - name: Upload frontend to S3
        env:
          S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${S3_FRONTEND_BUCKET:-}" ]]; then
            echo "S3_FRONTEND_BUCKET variable is required"
            exit 1
          fi

          echo "Syncing frontend artifacts to s3://$S3_FRONTEND_BUCKET"
          aws s3 sync ./promoted-dist "s3://$S3_FRONTEND_BUCKET" --delete

          OBJECT_COUNT=$(aws s3 ls "s3://$S3_FRONTEND_BUCKET/" --recursive | wc -l | xargs)
          if [[ "$OBJECT_COUNT" -eq 0 ]]; then
            echo "::error::S3 bucket is empty after sync: s3://$S3_FRONTEND_BUCKET"
            exit 1
          fi

          aws s3api head-object --bucket "$S3_FRONTEND_BUCKET" --key index.html >/dev/null
          echo "S3 object verification passed: count=$OBJECT_COUNT"

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'

      - name: Deploy backend container on EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID || 'i-0dbe396e361ea6d56' }}
          BACKEND_IMAGE: ${{ steps.verify-backend.outputs.backend_image }}
          BACKEND_SERVICE: ${{ steps.env-ids.outputs.backend_service }}
          BACKEND_IMAGE_VAR: ${{ steps.env-ids.outputs.backend_image_var }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${EC2_INSTANCE_ID:-}" ]]; then
            echo "EC2_INSTANCE_ID variable is required"
            exit 1
          fi

          echo "Checking SSM agent connectivity for instance $EC2_INSTANCE_ID..."
          for i in $(seq 1 20); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "Unknown")
            if [[ "$PING_STATUS" == "Online" ]]; then
              echo "SSM agent is online"
              break
            fi
            if [[ $i -eq 20 ]]; then
              echo "::error::SSM agent is not online after 60s (status: $PING_STATUS)"
              exit 1
            fi
            echo "SSM agent ping status: $PING_STATUS, retrying in 3s... ($i/20)"
            sleep 3
          done

          ECR_REGISTRY="${BACKEND_IMAGE%%/*}"
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          COMMANDS_JSON=$(jq -n \
            --arg deploy_path "$EC2_DEPLOY_PATH" \
            --arg image_var "$BACKEND_IMAGE_VAR" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_service "$BACKEND_SERVICE" \
            --arg ecr_registry "$ECR_REGISTRY" \
            --arg ecr_password "$ECR_PASSWORD" \
            '{
              commands: [
                "set -eu",
                "cd \($deploy_path)",
                "if [ ! -f infra/aws/docker-compose.multi-env.yml ]; then echo Missing compose file: \($deploy_path)/infra/aws/docker-compose.multi-env.yml; exit 1; fi",
                "if [ ! -f .env ]; then echo Missing env file: \($deploy_path)/.env; exit 1; fi",
                "if ! command -v docker >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2 && sudo systemctl enable --now docker; fi",
                "if ! sudo docker compose version >/dev/null 2>&1; then echo docker compose plugin missing after install; exit 1; fi",
                "echo \($ecr_password) | sudo docker login --username AWS --password-stdin \($ecr_registry)",
                "if sudo grep -q \"^\($image_var)=\" .env; then sudo sed -i \"s|^\($image_var)=.*|\($image_var)=\($backend_image)|\" .env; else echo \"\($image_var)=\($backend_image)\" | sudo tee -a .env >/dev/null; fi",
                "sudo grep \"^\($image_var)=\" .env",
                "sudo docker compose --env-file .env -f infra/aws/docker-compose.multi-env.yml pull \($backend_service) || { echo docker compose pull failed; exit 1; }",
                "sudo docker compose --env-file .env -f infra/aws/docker-compose.multi-env.yml up -d \($backend_service) || { echo docker compose up failed; sudo docker compose --env-file .env -f infra/aws/docker-compose.multi-env.yml logs --no-color \($backend_service); exit 1; }",
                "sudo docker image prune -f"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Promote $ENVIRONMENT $SHA" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          INVOCATION_JSON=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID")
          INVOCATION_STATUS=$(printf '%s' "$INVOCATION_JSON" | jq -r '.Status')
          STDOUT_CONTENT=$(printf '%s' "$INVOCATION_JSON" | jq -r '.StandardOutputContent')
          STDERR_CONTENT=$(printf '%s' "$INVOCATION_JSON" | jq -r '.StandardErrorContent')

          echo "$STDOUT_CONTENT"
          if [[ -n "$STDERR_CONTENT" && "$STDERR_CONTENT" != "null" ]]; then
            echo "$STDERR_CONTENT"
          fi

          if [[ "$INVOCATION_STATUS" != "Success" ]]; then
            echo "SSM deploy command failed with status: $INVOCATION_STATUS"
            exit 1
          fi

          if [[ "$WAIT_STATUS" -ne 0 ]]; then
            echo "SSM waiter returned non-zero status: $WAIT_STATUS"
            exit 1
          fi

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          API_URL: ${{ inputs.api_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Promoted commit: $SHA"
          echo "Frontend URL: $FRONTEND_URL"
          echo "API URL: $API_URL"
