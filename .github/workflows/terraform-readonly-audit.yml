name: Terraform read-only drift audit
on:
  pull_request:
    paths:
      - 'scripts/email-forwarding/**'
      - 'infra/aws/terraform/email-forwarding/**'
      - 'infra/aws/terraform/email-forwarding-iam/**'
      - '.github/workflows/terraform-readonly-audit.yml'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Read-only audit, email DNS plan, or separately approved Production DNS apply
        options: [audit, email-plan, email-apply]
        default: audit
      email_environment:
        type: choice
        description: Dev/Test can inspect shared apex DNS; only Production can apply
        options: [dev, test, prod]
        default: dev
permissions:
  contents: read
jobs:
  email-checks:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'pull_request' || inputs.operation != 'audit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/email-forwarding/*.test.cjs
      - run: python3 -m unittest discover -s scripts/email-forwarding -p 'test_*.py'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.3'
      - run: terraform -chdir=infra/aws/terraform/email-forwarding fmt -check
      - run: terraform -chdir=infra/aws/terraform/email-forwarding-iam fmt -check
      - run: terraform -chdir=infra/aws/terraform/email-forwarding-iam init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/aws/terraform/email-forwarding-iam validate -no-color
      - run: terraform -chdir=infra/aws/terraform/email-forwarding-iam test -no-color
      - run: terraform -chdir=infra/aws/terraform/email-forwarding init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/aws/terraform/email-forwarding validate -no-color
      - name: Verify protected environment configuration before OIDC
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EMAIL_ENVIRONMENT: ${{ inputs.email_environment }}
          EMAIL_OPERATION: ${{ inputs.operation }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/email-forwarding/check-environments.py
  email-plan:
    needs: email-checks
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'email-') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: terraform-email-${{ inputs.email_environment }}-plan
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: issue-400-dns-plan-${{ inputs.email_environment }}
      cancel-in-progress: false
    env:
      EMAIL_ENVIRONMENT: ${{ inputs.email_environment }}
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/aws/terraform/email-forwarding
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          allowed-account-ids: '178522450316'
          role-to-assume: ${{ vars.TERRAFORM_EMAIL_ROLE_ARN }}
          role-session-name: email-plan-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket","route53:GetHostedZone","route53:ListResourceRecordSets","route53:GetChange","ses:GetEmailIdentity"],"Resource":"*"}]}
      - name: Snapshot public DNS and SES health
        run: python3 "$GITHUB_WORKSPACE/scripts/email-forwarding/live-check.py" baseline.json
      - name: Initialize DNS-only state and produce plan
        run: |
          terraform init -input=false -lockfile=readonly > init.log 2>&1 || { echo '::error::DNS state initialization failed; raw output withheld'; exit 1; }
          terraform plan -input=false -lock=false -out=reviewed.tfplan > plan.log 2>&1 || { echo '::error::DNS plan failed; raw output withheld'; exit 1; }
          terraform show -json reviewed.tfplan > plan.json
          python3 "$GITHUB_WORKSPACE/scripts/email-forwarding/terraform-gate.py" seal plan.json --binary reviewed.tfplan --manifest manifest.json
      - name: Publish sanitized review summary
        run: |
          {
            echo '### Issue #400 — DNS-only plan'
            echo "Commit: $GITHUB_SHA; environment: $EMAIL_ENVIRONMENT"
            echo 'Allowed: create apex MX (10 mx1.improvmx.com, 20 mx2.improvmx.com); import/update apex TXT preserving Google verification and adding one SES/ImprovMX SPF record.'
            echo 'No other resources or DNS changes are permitted. Dev/Test are read-only. Production apply requires a separate protected job approval.'
            echo 'Provider verification and final inbox receipt are separate acceptance gates.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: issue-400-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/aws/terraform/email-forwarding/reviewed.tfplan
            infra/aws/terraform/email-forwarding/manifest.json
            infra/aws/terraform/email-forwarding/baseline.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove local plan logs
        if: always()
        run: rm -f init.log plan.log plan.json
  email-apply:
    needs: email-plan
    if: inputs.operation == 'email-apply' && inputs.email_environment == 'prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: terraform-email-prod-apply
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: issue-400-dns-apply
      cancel-in-progress: false
    env:
      EMAIL_ENVIRONMENT: prod
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/aws/terraform/email-forwarding
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check actual free provider account and alias routing before DNS
        env:
          IMPROVMX_API_KEY: ${{ secrets.IMPROVMX_API_KEY }}
        run: node "$GITHUB_WORKSPACE/scripts/email-forwarding/check-provider.cjs"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false
      - uses: actions/download-artifact@v7
        with:
          name: issue-400-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/aws/terraform/email-forwarding
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          allowed-account-ids: '178522450316'
          role-to-assume: ${{ vars.TERRAFORM_EMAIL_ROLE_ARN }}
          role-session-name: email-apply-${{ github.run_id }}
      - name: Reject stale plans and apply only reviewed binary
        run: |
          terraform init -input=false -lockfile=readonly > init.log 2>&1 || { echo '::error::DNS state initialization failed'; exit 1; }
          terraform plan -input=false -lock-timeout=60s -out=fresh.tfplan > fresh.log 2>&1 || { echo '::error::Fresh DNS plan failed'; exit 1; }
          terraform show -json fresh.tfplan > fresh.json
          python3 "$GITHUB_WORKSPACE/scripts/email-forwarding/terraform-gate.py" verify fresh.json --binary reviewed.tfplan --manifest manifest.json
          terraform apply -input=false -lock-timeout=60s reviewed.tfplan > apply.log 2>&1 || { echo '::error::Reviewed DNS apply failed; inspect with authorized access'; exit 1; }
      - name: Verify authoritative DNS and existing SES configuration
        run: python3 "$GITHUB_WORKSPACE/scripts/email-forwarding/live-check.py" baseline.json --compare
      - name: Verify provider forwarding is ready
        env:
          IMPROVMX_API_KEY: ${{ secrets.IMPROVMX_API_KEY }}
        run: node "$GITHUB_WORKSPACE/scripts/email-forwarding/check-provider.cjs" --ready
      - name: Send three bounded acceptance messages
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/email-forwarding/live-check.py" baseline.json --compare --send-tests | tee receipt-pending.txt
          cat receipt-pending.txt >> "$GITHUB_STEP_SUMMARY"
          echo '::error::PENDING MANUAL VERIFICATION: confirm all three correlation IDs in the destination inbox before declaring #400 accepted.'
          exit 1
      - name: Remove local plan logs
        if: always()
        run: rm -f init.log fresh.log fresh.json apply.log fresh.tfplan
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    permissions:
      contents: read
      id-token: write
    # Temporary pin for the October-November 2026 ubuntu-latest migration.
    # Remove only after the audit matrix is verified on ubuntu-26.04 (Issue #387).
    runs-on: ubuntu-24.04
    environment: terraform-readonly-audit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        root: [global, envs/dev, envs/test, envs/prod]
    defaults:
      run:
        working-directory: infra/aws/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test audit input safeguards
        run: python3 -m unittest discover -s "${{ github.workspace }}/.github/scripts/tests" -p 'test_terraform_audit_inputs.py'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.3'
      - name: Validate formatting
        run: terraform fmt -check -recursive
      - name: Authenticate read-only AWS audit role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.TERRAFORM_AUDIT_ROLE_ARN }}
          role-session-name: terraform-audit-${{ github.run_id }}
      - name: Prepare reviewed global audit inputs
        if: matrix.root == 'global'
        run: |
          python3 "${{ github.workspace }}/.github/scripts/terraform-audit-inputs.py" \
            --manifest "${{ github.workspace }}/.github/config/terraform-audit-global.json" \
            --output "$RUNNER_TEMP/terraform-audit-global"
          echo "TF_CLI_ARGS_plan=-var-file=$RUNNER_TEMP/terraform-audit-global/global.tfvars.json" >> "$GITHUB_ENV"
      - name: Initialize existing remote state (no migration)
        run: terraform init -input=false -lockfile=readonly -migrate-state=false
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Refresh-only drift inspection
        id: refresh
        continue-on-error: true
        run: |
          set +e
          terraform plan -refresh-only -input=false -lock=false -detailed-exitcode -no-color > /tmp/tf-refresh.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Refresh-only result: $code (0=no drift, 2=drift, 1=error)"
          if [ "$code" -eq 1 ]; then
            python3 "${{ github.workspace }}/.github/scripts/terraform-audit-diagnose.py" /tmp/tf-refresh.log
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::Terraform refresh-only plan failed in ${{ matrix.root }}. Run locally with a read-only role to inspect the error; raw logs are not exposed in Actions."
          fi
          exit 0
      - name: Desired configuration comparison
        id: desired
        continue-on-error: true
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color > /tmp/tf-desired.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Desired-state result: $code (0=no change, 2=proposed change, 1=error)"
          if [ "$code" -eq 1 ]; then
            python3 "${{ github.workspace }}/.github/scripts/terraform-audit-diagnose.py" /tmp/tf-desired.log
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::Terraform desired-state plan failed in ${{ matrix.root }}. No drift conclusion is possible."
          fi
          exit 0
      - name: Publish sanitized status summary only
        if: always()
        env:
          ROOT: ${{ matrix.root }}
          REFRESH: ${{ steps.refresh.outputs.exit_code }}
          DESIRED: ${{ steps.desired.outputs.exit_code }}
        run: |
          {
            echo "### Terraform read-only audit: $ROOT"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Refresh-only exit: \`${REFRESH:-not-run}\`"
            echo "- Desired-state exit: \`${DESIRED:-not-run}\`"
            echo "- Exit 0 = no change, 2 = drift/planned change, 1 = error"
            echo "- Detailed plan/state logs are intentionally not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/tf-refresh.log /tmp/tf-desired.log
          rm -rf "$RUNNER_TEMP/terraform-audit-global"
      - name: Remove helper-owned package links
        if: always() && matrix.root == 'global'
        run: |
          python3 "${{ github.workspace }}/.github/scripts/terraform-audit-inputs.py" \
            --manifest "${{ github.workspace }}/.github/config/terraform-audit-global.json" \
            --output "$RUNNER_TEMP/terraform-audit-global" --cleanup
      - name: Enforce audit result
        if: always()
        env:
          REFRESH: ${{ steps.refresh.outputs.exit_code }}
          DESIRED: ${{ steps.desired.outputs.exit_code }}
        run: |
          if [ "$REFRESH" = "1" ] || [ "$DESIRED" = "1" ]; then
            echo "::error::Terraform audit encountered plan errors; cannot declare success."
            exit 1
          fi
          if [ -z "$REFRESH" ] || [ -z "$DESIRED" ]; then
            echo "::error::Terraform audit incomplete."
            exit 1
          fi
