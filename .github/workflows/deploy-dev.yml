name: Deploy Dev (EC2 + S3)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DEPLOY_ENV: dev
  BACKEND_SERVICE: backend-dev
  BACKEND_IMAGE_VAR: BACKEND_IMAGE_DEV
  BACKEND_IMAGE_NAME: recruiterreply-backend
  FRONTEND_API_BASE_URL: https://api-dev.recruiterreply.com
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/recruiterreply' }}
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate AWS auth input shape
        env:
          ROLE_INPUT: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          ACCESS_KEY_INPUT: ${{ vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${ACCESS_KEY_INPUT:-}" && "${ACCESS_KEY_INPUT}" == arn:aws:iam::* ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is set to an IAM role ARN. Move this value to AWS_ROLE_TO_ASSUME (vars or secrets) and remove it from AWS_ACCESS_KEY_ID."
            exit 1
          fi
          if [[ -z "${ROLE_INPUT:-}" && -z "${ACCESS_KEY_INPUT:-}" ]]; then
            echo "::error::No AWS auth input found. Set AWS_ROLE_TO_ASSUME (vars/secrets) for OIDC, or set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (vars/secrets) for static-key auth."
            exit 1
          fi

      - name: Resolve AWS auth inputs
        id: aws-auth
        env:
          ROLE_FROM_VARS: ${{ vars.AWS_ROLE_TO_ASSUME }}
          ROLE_FROM_SECRETS: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          ROLE_ARN_FROM_VARS: ${{ vars.AWS_ROLE_ARN }}
          ROLE_ARN_FROM_SECRETS: ${{ secrets.AWS_ROLE_ARN }}
          KEY_FROM_VARS: ${{ vars.AWS_ACCESS_KEY_ID }}
          KEY_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_ALIAS_FROM_VARS: ${{ vars.AWS_ACCESS_KEY }}
          KEY_ALIAS_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY }}
          SECRET_FROM_VARS: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_ALIAS_FROM_VARS: ${{ vars.AWS_SECRET_KEY }}
          SECRET_ALIAS_FROM_SECRETS: ${{ secrets.AWS_SECRET_KEY }}
          TOKEN_FROM_VARS: ${{ vars.AWS_SESSION_TOKEN }}
          TOKEN_FROM_SECRETS: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          ROLE_TO_ASSUME="${ROLE_FROM_VARS:-${ROLE_FROM_SECRETS:-${ROLE_ARN_FROM_VARS:-${ROLE_ARN_FROM_SECRETS:-}}}}"
          AWS_ACCESS_KEY_ID_VAL="${KEY_FROM_VARS:-${KEY_FROM_SECRETS:-${KEY_ALIAS_FROM_VARS:-${KEY_ALIAS_FROM_SECRETS:-}}}}"
          AWS_SECRET_ACCESS_KEY_VAL="${SECRET_FROM_SECRETS:-${SECRET_FROM_VARS:-${SECRET_ALIAS_FROM_SECRETS:-${SECRET_ALIAS_FROM_VARS:-}}}}"
          AWS_SESSION_TOKEN_VAL="${TOKEN_FROM_SECRETS:-${TOKEN_FROM_VARS:-}}"

          ROLE_SET=false
          ACCESS_KEY_SET=false
          SECRET_KEY_SET=false
          SESSION_TOKEN_SET=false

          if [[ -n "$ROLE_TO_ASSUME" ]]; then ROLE_SET=true; fi
          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" ]]; then ACCESS_KEY_SET=true; fi
          if [[ -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then SECRET_KEY_SET=true; fi
          if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then SESSION_TOKEN_SET=true; fi

          echo "AWS auth input presence: role=$ROLE_SET access_key_id=$ACCESS_KEY_SET secret_access_key=$SECRET_KEY_SET session_token=$SESSION_TOKEN_SET"

          if [[ -n "$ROLE_TO_ASSUME" ]]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            echo "role_to_assume=$ROLE_TO_ASSUME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" && -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then
            echo "auth_mode=keys" >> "$GITHUB_OUTPUT"
            echo "aws_access_key_id=$AWS_ACCESS_KEY_ID_VAL" >> "$GITHUB_OUTPUT"
            echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY_VAL" >> "$GITHUB_OUTPUT"
            if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then
              echo "aws_session_token=$AWS_SESSION_TOKEN_VAL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "::error::Missing AWS auth config. Provide either AWS_ROLE_TO_ASSUME (vars/secrets) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (vars/secrets)."
          echo "::error::Checked aliases too: AWS_ROLE_ARN, AWS_ACCESS_KEY, AWS_SECRET_KEY."
          exit 1

      - name: Configure AWS credentials (OIDC role)
        if: steps.aws-auth.outputs.auth_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-auth.outputs.role_to_assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.aws-auth.outputs.auth_mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.aws-auth.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.aws-auth.outputs.aws_secret_access_key }}
          aws-session-token: ${{ steps.aws-auth.outputs.aws_session_token }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend image
        id: build-backend
        run: |
          set -euo pipefail
          BACKEND_IMAGE="$BACKEND_IMAGE_NAME:${GITHUB_SHA}"
          docker build -t "$BACKEND_IMAGE" ./backend
          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          VITE_API_BASE_URL="$FRONTEND_API_BASE_URL" npm run build

      - name: Verify frontend build artifacts
        run: |
          set -euo pipefail

          if [[ ! -f frontend/dist/index.html ]]; then
            echo "::error::Missing frontend/dist/index.html after build"
            exit 1
          fi

          if [[ ! -d frontend/dist/assets ]]; then
            echo "::error::Missing frontend/dist/assets after build"
            exit 1
          fi

          ASSET_COUNT=$(find frontend/dist/assets -type f | wc -l | xargs)
          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "::error::No frontend assets were generated"
            exit 1
          fi

          echo "Frontend artifact check passed: assets=$ASSET_COUNT"

      - name: Upload frontend to S3
        env:
          S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${S3_FRONTEND_BUCKET:-}" ]]; then
            echo "S3_FRONTEND_BUCKET variable is required"
            exit 1
          fi

          echo "Syncing frontend artifacts to s3://$S3_FRONTEND_BUCKET"
          aws s3 sync frontend/dist/ "s3://$S3_FRONTEND_BUCKET" --delete

          OBJECT_COUNT=$(aws s3 ls "s3://$S3_FRONTEND_BUCKET/" --recursive | wc -l | xargs)
          if [[ "$OBJECT_COUNT" -eq 0 ]]; then
            echo "::error::S3 bucket is empty after sync: s3://$S3_FRONTEND_BUCKET"
            exit 1
          fi

          aws s3api head-object --bucket "$S3_FRONTEND_BUCKET" --key index.html >/dev/null
          echo "S3 object verification passed: count=$OBJECT_COUNT"

      - name: Verify CloudFront origin matches S3 bucket
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          ORIGIN_DOMAIN=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Origins.Items[0].DomainName' \
            --output text)

          echo "CloudFront origin domain: $ORIGIN_DOMAIN"
          if [[ "$ORIGIN_DOMAIN" != *"$S3_FRONTEND_BUCKET"* ]]; then
            echo "::error::CloudFront origin does not reference S3_FRONTEND_BUCKET"
            echo "::error::Expected bucket: $S3_FRONTEND_BUCKET"
            echo "::error::Actual origin domain: $ORIGIN_DOMAIN"
            exit 1
          fi

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'

      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${EC2_SSH_PRIVATE_KEY:-}" ]]; then
            echo "EC2_SSH_PRIVATE_KEY secret is required"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy backend container on EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          BACKEND_IMAGE: ${{ steps.build-backend.outputs.backend_image }}
        run: |
          set -euo pipefail
          if [[ -z "${EC2_HOST:-}" ]]; then
            echo "EC2_HOST variable is required"
            exit 1
          fi

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Ensure docker exists on EC2 before attempting streamed image load.
          ssh "$EC2_USER@$EC2_HOST" 'if ! command -v docker >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2 && sudo systemctl enable --now docker; fi'

          # Stream image directly to EC2 to avoid temp-file/scp failures.
          if ! STREAM_LOAD_OUTPUT=$(docker save "$BACKEND_IMAGE" | gzip | ssh "$EC2_USER@$EC2_HOST" 'gunzip | sudo docker load' 2>&1); then
            echo "$STREAM_LOAD_OUTPUT"
            echo "Streamed docker load failed for image: $BACKEND_IMAGE"
            exit 1
          fi
          echo "$STREAM_LOAD_OUTPUT"
          LOADED_IMAGE_REF=$(printf '%s\n' "$STREAM_LOAD_OUTPUT" | sed -n 's/^Loaded image: //p' | tail -1)

          ssh "$EC2_USER@$EC2_HOST" bash -s -- \
            "$EC2_DEPLOY_PATH" \
            "$BACKEND_IMAGE_VAR" \
            "$BACKEND_IMAGE" \
            "$BACKEND_SERVICE" \
            "$LOADED_IMAGE_REF" << 'EOF'
          set -euo pipefail

          DEPLOY_PATH="$1"
          IMAGE_VAR="$2"
          BACKEND_IMAGE="$3"
          BACKEND_SERVICE="$4"
          LOADED_IMAGE_REF="$5"

          if [[ ! -d "$DEPLOY_PATH" ]]; then
            echo "Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          cd "$DEPLOY_PATH"

          if [[ ! -f infra/aws/docker-compose.multi-env.yml ]]; then
            echo "Missing compose file: $DEPLOY_PATH/infra/aws/docker-compose.multi-env.yml"
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; installing docker.io and docker-compose-v2"
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose-v2
            sudo systemctl enable --now docker
          fi

          if ! sudo docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin missing after install"
            exit 1
          fi

          if [[ ! -f .env ]]; then
            echo "Missing env file: $DEPLOY_PATH/.env"
            exit 1
          fi

          if ! sudo docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
            if [[ -n "$LOADED_IMAGE_REF" ]] && sudo docker image inspect "$LOADED_IMAGE_REF" >/dev/null 2>&1; then
              echo "Retagging loaded image '$LOADED_IMAGE_REF' to '$BACKEND_IMAGE'"
              sudo docker tag "$LOADED_IMAGE_REF" "$BACKEND_IMAGE"
            fi
          fi

          if ! sudo docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
            echo "Loaded image tag not found on EC2 after streamed docker load: $BACKEND_IMAGE"
            sudo docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}' | sed -n '1,40p'
            exit 1
          fi

          sudo touch .env
          sudo chmod 600 .env
          if sudo grep -q "^${IMAGE_VAR}=" .env; then
            sudo sed -i "s|^${IMAGE_VAR}=.*|${IMAGE_VAR}=${BACKEND_IMAGE}|" .env
          else
            echo "${IMAGE_VAR}=${BACKEND_IMAGE}" | sudo tee -a .env >/dev/null
          fi

          if ! sudo grep -q "^${IMAGE_VAR}=${BACKEND_IMAGE}$" .env; then
            echo "Failed to set ${IMAGE_VAR} in $DEPLOY_PATH/.env"
            exit 1
          fi

          echo "Resolved ${IMAGE_VAR} in .env:"
          sudo grep "^${IMAGE_VAR}=" .env

          sudo docker compose --env-file .env -f infra/aws/docker-compose.multi-env.yml up -d "$BACKEND_SERVICE"
          sudo docker image prune -f
          EOF

      - name: Deployment summary
        run: |
          echo "Environment: $DEPLOY_ENV"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Frontend URL: https://dev.recruiterreply.com"
          echo "API URL: https://api-dev.recruiterreply.com"
