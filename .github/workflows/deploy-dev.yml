name: Deploy Dev (ECS)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPO_FRONTEND: recruiterreply-frontend
  ECR_REPO_BACKEND: recruiterreply-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO_FRONTEND:dev-latest" -t "$REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_SHA" ./frontend
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:dev-latest"
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_SHA"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO_BACKEND:dev-latest" -t "$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA" ./backend
          docker push "$REGISTRY/$ECR_REPO_BACKEND:dev-latest"
          docker push "$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA"

      - name: Force new deployment on ECS services
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_FRONTEND_SERVICE }}" \
            --force-new-deployment

          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_BACKEND_SERVICE }}" \
            --force-new-deployment

      - name: Wait until services are stable
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_FRONTEND_SERVICE }}" "${{ secrets.ECS_BACKEND_SERVICE }}"

      - name: Deployment summary
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          echo "Cluster: ${{ secrets.ECS_CLUSTER }}"
          echo "Frontend service: ${{ secrets.ECS_FRONTEND_SERVICE }}"
          echo "Backend service: ${{ secrets.ECS_BACKEND_SERVICE }}"
