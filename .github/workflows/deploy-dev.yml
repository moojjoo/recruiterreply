name: Deploy Dev (EKS)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPO_FRONTEND: recruiterreply-frontend
  ECR_REPO_BACKEND: recruiterreply-backend
  K8S_NAMESPACE: recruiterreply-dev
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve AWS auth inputs
        id: aws-auth
        env:
          ROLE_FROM_VARS: ${{ vars.AWS_ROLE_TO_ASSUME }}
          ROLE_FROM_SECRETS: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          KEY_FROM_VARS: ${{ vars.AWS_ACCESS_KEY_ID }}
          KEY_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_FROM_VARS: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TOKEN_FROM_VARS: ${{ vars.AWS_SESSION_TOKEN }}
          TOKEN_FROM_SECRETS: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          ROLE_TO_ASSUME="${ROLE_FROM_VARS:-${ROLE_FROM_SECRETS:-}}"
          AWS_ACCESS_KEY_ID_VAL="${KEY_FROM_VARS:-${KEY_FROM_SECRETS:-}}"
          AWS_SECRET_ACCESS_KEY_VAL="${SECRET_FROM_SECRETS:-${SECRET_FROM_VARS:-}}"
          AWS_SESSION_TOKEN_VAL="${TOKEN_FROM_SECRETS:-${TOKEN_FROM_VARS:-}}"

          ROLE_SET=false
          ACCESS_KEY_SET=false
          SECRET_KEY_SET=false
          SESSION_TOKEN_SET=false

          if [[ -n "$ROLE_TO_ASSUME" ]]; then ROLE_SET=true; fi
          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" ]]; then ACCESS_KEY_SET=true; fi
          if [[ -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then SECRET_KEY_SET=true; fi
          if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then SESSION_TOKEN_SET=true; fi

          echo "AWS auth input presence: role=$ROLE_SET access_key_id=$ACCESS_KEY_SET secret_access_key=$SECRET_KEY_SET session_token=$SESSION_TOKEN_SET"

          if [[ -n "$ROLE_TO_ASSUME" ]]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            echo "role_to_assume=$ROLE_TO_ASSUME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" && -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then
            echo "auth_mode=keys" >> "$GITHUB_OUTPUT"
            echo "aws_access_key_id=$AWS_ACCESS_KEY_ID_VAL" >> "$GITHUB_OUTPUT"
            echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY_VAL" >> "$GITHUB_OUTPUT"
            if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then
              echo "aws_session_token=$AWS_SESSION_TOKEN_VAL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "::error::Missing AWS auth config. Provide either AWS_ROLE_TO_ASSUME (vars/secrets) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (vars/secrets)."
          echo "::error::If you configured Environment-level values, ensure DEPLOY_ENVIRONMENT points to that environment name (current: ${DEPLOY_ENVIRONMENT:-dev})."
          exit 1

      - name: Configure AWS credentials (OIDC role)
        if: steps.aws-auth.outputs.auth_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-auth.outputs.role_to_assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.aws-auth.outputs.auth_mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.aws-auth.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.aws-auth.outputs.aws_secret_access_key }}
          aws-session-token: ${{ steps.aws-auth.outputs.aws_session_token }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t "$REGISTRY/$ECR_REPO_FRONTEND:dev-latest" \
            -t "$REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_SHA" \
            ./frontend
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:dev-latest"
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_SHA"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO_BACKEND:dev-latest" -t "$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA" ./backend
          docker push "$REGISTRY/$ECR_REPO_BACKEND:dev-latest"
          docker push "$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA"

      - name: Configure kubeconfig for EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "$AWS_REGION"

      - name: Sync backend secret from AWS Secrets Manager
        run: |
          set -euo pipefail
          OPENAI_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.OPENAI_SECRET_ID }}" \
            --query SecretString \
            --output text)
          JWT_KEY="${{ secrets.JWT_KEY }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          if [[ -z "$JWT_KEY" ]]; then
            echo "JWT_KEY secret is required"
            exit 1
          fi

          if [[ -z "$DB_PASSWORD" ]]; then
            echo "DB_PASSWORD secret is required"
            exit 1
          fi

          CONNECTION_STRING="Host=recruiterreply-postgres;Port=5432;Database=recruiterreply_dev;Username=recruiterreply_dev;Password=$DB_PASSWORD"

          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$K8S_NAMESPACE" create secret generic recruiterreply-backend-secrets \
            --from-literal=OpenAI__ApiKey="$OPENAI_KEY" \
            --from-literal=Jwt__Key="$JWT_KEY" \
            --from-literal=Postgres__Password="$DB_PASSWORD" \
            --from-literal=ConnectionStrings__DefaultConnection="$CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl apply -k infra/k8s/dev

      - name: Run database init job
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" delete job recruiterreply-db-init --ignore-not-found=true
          kubectl apply -f infra/k8s/dev/db-init-job.yaml
          kubectl -n "$K8S_NAMESPACE" wait --for=condition=complete job/recruiterreply-db-init --timeout=300s

      - name: Set image tags for this commit
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" set image deployment/recruiterreply-frontend frontend="$REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_SHA"
          kubectl -n "$K8S_NAMESPACE" set image deployment/recruiterreply-backend backend="$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/recruiterreply-frontend --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/recruiterreply-backend --timeout=300s

      - name: Deployment summary
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          echo "EKS cluster: ${{ secrets.EKS_CLUSTER_NAME }}"
          echo "Namespace: $K8S_NAMESPACE"
          kubectl -n "$K8S_NAMESPACE" get deploy,svc,ingress
