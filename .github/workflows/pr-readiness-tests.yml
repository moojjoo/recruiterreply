name: PR readiness policy tests
on:
  pull_request:
    paths:
      - '.github/scripts/pr-readiness.cjs'
      - '.github/scripts/pr-readiness.test.cjs'
      - '.github/scripts/tests/dependabot-automerge.test.cjs'
      - '.github/scripts/tests/execute-pr-automation.test.cjs'
      - '.github/scripts/tests/dependabot-config.test.cjs'
      - '.github/dependabot.yml'
      - '.github/workflows/execute-pr-automation.yml'
      - '.github/workflows/pr-readiness-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
          node --test .github/scripts/pr-readiness.test.cjs
          node --test .github/scripts/tests/dependabot-automerge.test.cjs
          node --test .github/scripts/tests/execute-pr-automation.test.cjs
          node --test .github/scripts/tests/dependabot-config.test.cjs
