name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the successful Test deployment approved for Production
        required: true
        type: string

permissions:
  actions: read
  id-token: write
  contents: read
  deployments: read

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Select latest successful test deployment
        id: release
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const environment = 'test';
            const expectedSha = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expectedSha)) {
              core.setFailed('expected_sha must be a full lowercase commit SHA.');
              return;
            }
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment, per_page: 100
            });
            for (const deployment of deployments) {
              if (!/^[a-f0-9]{40}$/.test(deployment.sha)) continue;
              const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 100
              });
              // Only the latest status is authoritative; never select an older success
              // if the same deployment was subsequently marked failed/inactive.
              if (statuses[0]?.state !== 'success') continue;
              if (deployment.sha !== expectedSha) {
                core.setFailed(`Release race: latest successful ${environment} deployment is ${deployment.sha}, but ${expectedSha} was approved. Re-verify before promoting.`);
                return;
              }
              core.info(`Selected ${environment} deployment ${deployment.id} SHA ${deployment.sha}`);
              core.setOutput('sha', deployment.sha);
              return;
            }
            core.setFailed(`No successful ${environment} deployment with a full SHA was found. Refusing promotion.`);

  promote:
    needs: resolve-source
    concurrency:
      group: promote-prod
      cancel-in-progress: false
    uses: ./.github/workflows/promote.yml
    with:
      environment: prod
      sha: ${{ needs.resolve-source.outputs.sha }}
      api_base_url: https://api.recruiterreply.com/api
      frontend_url: https://recruiterreply.com
      api_url: https://api.recruiterreply.com
      robots_txt: |
        User-agent: *
        Allow: /
        Disallow: /dashboard
        Disallow: /analyze
        Disallow: /reply
        Disallow: /compare
        Disallow: /profile
        Disallow: /opportunities
        Disallow: /gmail/
        Disallow: /auth/

        Sitemap: https://recruiterreply.com/sitemap.xml

  search-engine-discovery:
    needs: [resolve-source, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Checkout promoted source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous successful Production SHA
        id: previous
        uses: actions/github-script@v9
        env:
          CURRENT_SHA: ${{ needs.resolve-source.outputs.sha }}
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'prod', per_page: 100
            });
            for (const deployment of deployments) {
              if (deployment.sha === process.env.CURRENT_SHA || !/^[a-f0-9]{40}$/.test(deployment.sha)) continue;
              const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1
              });
              if (statuses[0]?.state === 'success') {
                core.setOutput('sha', deployment.sha);
                return;
              }
            }
            core.notice('No prior successful Production deployment found; all sitemap URLs will be considered new.');

      - name: Prepare canonical URL change set
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          CURRENT_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/previous-sitemap.xml"
          printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>' > "$RUNNER_TEMP/previous-sitemap.xml"
          : > "$RUNNER_TEMP/changed-files.txt"
          if [[ -n "$PREVIOUS_SHA" ]] && git cat-file -e "$PREVIOUS_SHA^{commit}"; then
            if git cat-file -e "$PREVIOUS_SHA:frontend/public/sitemap.xml"; then
              git show "$PREVIOUS_SHA:frontend/public/sitemap.xml" > "$RUNNER_TEMP/previous-sitemap.xml"
            fi
            git diff --name-only "$PREVIOUS_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/changed-files.txt"
          fi

      - name: Submit changed Production URLs after successful deployment
        env:
          DEPLOYMENT_ENVIRONMENT: prod
          CURRENT_SITEMAP: frontend/public/sitemap.xml
          PREVIOUS_SITEMAP: ${{ runner.temp }}/previous-sitemap.xml
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
        run: node .github/scripts/search-engine-submission.mjs
