name: Authenticated Dev/Test Playwright

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Lower environment to validate
        required: true
        type: choice
        options:
          - dev
          - test
      base_url:
        description: Optional deployed URL override
        required: false
        type: string
      deployed_sha:
        description: Exact deployed release SHA under acceptance
        required: true
        type: string
      backend_digest:
        description: Exact deployed backend image digest
        required: true
        type: string
      test_revision:
        description: Deliberately selected revision containing the acceptance tests
        required: true
        type: string

concurrency:
  # Promotion and acceptance share the same physical host and therefore the
  # same lease. The dispatched run starts only after its promotion releases it.
  group: recruiterreply-shared-host-promotions
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_ENV: ${{ inputs.environment }}
      BASE_URL: ${{ inputs.base_url }}
      PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
      PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
      PLAYWRIGHT_TOTP_SECRET: ${{ secrets.PLAYWRIGHT_TOTP_SECRET }}
      PLAYWRIGHT_AUTH_DIR: ${{ github.workspace }}/.playwright-auth-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_ALLOWED_AUTH_HOSTS: ${{ (inputs.environment == 'dev' && vars.DEV_COGNITO_DOMAIN) || vars.TEST_COGNITO_DOMAIN }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      BACKEND_DIGEST: ${{ inputs.backend_digest }}
      TEST_REVISION: ${{ inputs.test_revision }}
      # Optional application-pool credentials. If omitted, the setup falls
      # back to the perimeter credentials for environments that intentionally
      # use the same native Cognito account in both layers.
      PLAYWRIGHT_APP_USERNAME: ${{ secrets.PLAYWRIGHT_APP_USERNAME }}
      PLAYWRIGHT_APP_PASSWORD: ${{ secrets.PLAYWRIGHT_APP_PASSWORD }}
      PLAYWRIGHT_APP_TOTP_SECRET: ${{ secrets.PLAYWRIGHT_APP_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.test_revision }}
          persist-credentials: false
      - name: Verify exact release and deliberate test revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/exact-release-acceptance.cjs initialize
          if ! node .github/scripts/exact-release-acceptance.cjs verify; then
            node .github/scripts/exact-release-acceptance.cjs record blocked
            exit 1
          fi
          manifest_dir=$(mktemp -d)
          trap 'rm -rf -- "$manifest_dir"' EXIT
          artifact_name="release-manifest-${PLAYWRIGHT_ENV}-${DEPLOYED_SHA}"
          artifact_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [[ ! "$artifact_id" =~ ^[0-9]+$ ]] ||
             ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$manifest_dir/manifest.zip" ||
             ! unzip -q "$manifest_dir/manifest.zip" -d "$manifest_dir/release" ||
             ! jq -e --arg environment "$PLAYWRIGHT_ENV" --arg sha "$DEPLOYED_SHA" --arg digest "$BACKEND_DIGEST" \
               '.environment == $environment and .sha == $sha and .backend_digest == $digest and .status == "success"' \
               "$manifest_dir/release/release-manifest.json" >/dev/null; then
            node .github/scripts/exact-release-acceptance.cjs record blocked
            echo '::error::Exact deployed release manifest is missing or does not match the requested identity.'
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser validation
        run: |
          set -euo pipefail
          if npx playwright test --config=playwright.auth.config.ts; then
            node .github/scripts/exact-release-acceptance.cjs record passed
          else
            node .github/scripts/exact-release-acceptance.cjs record failed
            exit 1
          fi
      - name: Remove run-scoped authentication state
        if: ${{ always() }}
        run: rm -rf -- "$PLAYWRIGHT_AUTH_DIR"
      - name: Upload sanitized acceptance outcome
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exact-release-acceptance-${{ inputs.environment }}-${{ inputs.deployed_sha }}
          path: exact-release-acceptance.json
          if-no-files-found: error
          retention-days: 90
