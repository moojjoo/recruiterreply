name: Cognito edge verification unit tests

on:
  pull_request:
    paths:
      - 'infra/aws/edge/private-auth/**'
      - '.github/workflows/cognito-edge-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-edge-tokens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test infra/aws/edge/private-auth/*.test.cjs
