name: Deploy Prod (EC2 + S3)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DEPLOY_ENV: prod
  BACKEND_SERVICE: backend-prod
  BACKEND_IMAGE_VAR: BACKEND_IMAGE_PROD
  BACKEND_IMAGE_TAG: prod-latest
  FRONTEND_API_BASE_URL: https://api.recruiterreply.com
  ECR_REPO_BACKEND: ${{ vars.ECR_REPO_BACKEND || 'recruiterreply-backend' }}
  BACKEND_DOCKER_PLATFORM: ${{ vars.BACKEND_DOCKER_PLATFORM || 'linux/amd64' }}
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/recruiterreply' }}
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve AWS auth inputs
        id: aws-auth
        env:
          ROLE_FROM_VARS: ${{ vars.AWS_ROLE_TO_ASSUME }}
          ROLE_FROM_SECRETS: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          ROLE_ARN_FROM_VARS: ${{ vars.AWS_ROLE_ARN }}
          ROLE_ARN_FROM_SECRETS: ${{ secrets.AWS_ROLE_ARN }}
          KEY_FROM_VARS: ${{ vars.AWS_ACCESS_KEY_ID }}
          KEY_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_ALIAS_FROM_VARS: ${{ vars.AWS_ACCESS_KEY }}
          KEY_ALIAS_FROM_SECRETS: ${{ secrets.AWS_ACCESS_KEY }}
          SECRET_FROM_VARS: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_ALIAS_FROM_VARS: ${{ vars.AWS_SECRET_KEY }}
          SECRET_ALIAS_FROM_SECRETS: ${{ secrets.AWS_SECRET_KEY }}
          TOKEN_FROM_VARS: ${{ vars.AWS_SESSION_TOKEN }}
          TOKEN_FROM_SECRETS: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          ROLE_TO_ASSUME="${ROLE_FROM_VARS:-${ROLE_FROM_SECRETS:-${ROLE_ARN_FROM_VARS:-${ROLE_ARN_FROM_SECRETS:-}}}}"
          AWS_ACCESS_KEY_ID_VAL="${KEY_FROM_VARS:-${KEY_FROM_SECRETS:-${KEY_ALIAS_FROM_VARS:-${KEY_ALIAS_FROM_SECRETS:-}}}}"
          AWS_SECRET_ACCESS_KEY_VAL="${SECRET_FROM_SECRETS:-${SECRET_FROM_VARS:-${SECRET_ALIAS_FROM_SECRETS:-${SECRET_ALIAS_FROM_VARS:-}}}}"
          AWS_SESSION_TOKEN_VAL="${TOKEN_FROM_SECRETS:-${TOKEN_FROM_VARS:-}}"

          if [[ -n "$ROLE_TO_ASSUME" ]]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            echo "role_to_assume=$ROLE_TO_ASSUME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$AWS_ACCESS_KEY_ID_VAL" && -n "$AWS_SECRET_ACCESS_KEY_VAL" ]]; then
            echo "auth_mode=keys" >> "$GITHUB_OUTPUT"
            echo "aws_access_key_id=$AWS_ACCESS_KEY_ID_VAL" >> "$GITHUB_OUTPUT"
            echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY_VAL" >> "$GITHUB_OUTPUT"
            if [[ -n "$AWS_SESSION_TOKEN_VAL" ]]; then
              echo "aws_session_token=$AWS_SESSION_TOKEN_VAL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "::error::Missing AWS auth config. Provide either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY."
          exit 1

      - name: Configure AWS credentials (OIDC role)
        if: steps.aws-auth.outputs.auth_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-auth.outputs.role_to_assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.aws-auth.outputs.auth_mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.aws-auth.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.aws-auth.outputs.aws_secret_access_key }}
          aws-session-token: ${{ steps.aws-auth.outputs.aws_session_token }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build-backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI_SHA="$REGISTRY/$ECR_REPO_BACKEND:$IMAGE_SHA"
          IMAGE_URI_LATEST="$REGISTRY/$ECR_REPO_BACKEND:$BACKEND_IMAGE_TAG"

          docker buildx build \
            --platform "$BACKEND_DOCKER_PLATFORM" \
            --push \
            -t "$IMAGE_URI_SHA" \
            -t "$IMAGE_URI_LATEST" \
            ./backend

          echo "backend_image=$IMAGE_URI_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          VITE_API_BASE_URL="$FRONTEND_API_BASE_URL" npm run build

      - name: Upload frontend to S3
        env:
          S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${S3_FRONTEND_BUCKET:-}" ]]; then
            echo "S3_FRONTEND_BUCKET variable is required"
            exit 1
          fi

          aws s3 sync frontend/dist/ "s3://$S3_FRONTEND_BUCKET" --delete

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID variable is required"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'

      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${EC2_SSH_PRIVATE_KEY:-}" ]]; then
            echo "EC2_SSH_PRIVATE_KEY secret is required"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy backend container on EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          BACKEND_IMAGE: ${{ steps.build-backend.outputs.backend_image }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [[ -z "${EC2_HOST:-}" ]]; then
            echo "EC2_HOST variable is required"
            exit 1
          fi

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh "$EC2_USER@$EC2_HOST" bash -s -- \
            "$EC2_DEPLOY_PATH" \
            "$BACKEND_IMAGE_VAR" \
            "$BACKEND_IMAGE" \
            "$BACKEND_SERVICE" \
            "$AWS_REGION" \
            "$ECR_REGISTRY" << 'EOF'
          set -euo pipefail

          DEPLOY_PATH="$1"
          IMAGE_VAR="$2"
          BACKEND_IMAGE="$3"
          BACKEND_SERVICE="$4"
          AWS_REGION="$5"
          ECR_REGISTRY="$6"

          cd "$DEPLOY_PATH"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          touch .env
          if grep -q "^${IMAGE_VAR}=" .env; then
            sed -i "s|^${IMAGE_VAR}=.*|${IMAGE_VAR}=${BACKEND_IMAGE}|" .env
          else
            echo "${IMAGE_VAR}=${BACKEND_IMAGE}" >> .env
          fi

          docker compose -f infra/aws/docker-compose.multi-env.yml pull "$BACKEND_SERVICE"
          docker compose -f infra/aws/docker-compose.multi-env.yml up -d "$BACKEND_SERVICE"
          docker image prune -f
          EOF

      - name: Deployment summary
        run: |
          echo "Environment: $DEPLOY_ENV"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Frontend URL: https://recruiterreply.com"
          echo "API URL: https://api.recruiterreply.com"