name: Read-only Dev issue reconciliation report
on:
  schedule:
    - cron: '19 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Generate read-only reconciliation report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/report-dev-reconciliation.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-issue-reconciliation-report
          path: reconciliation-report/
          retention-days: 30
