name: Issue Reconciliation Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report merged PRs with open completion issues
        env:
          PROJECTS_WRITE_TOKEN: ${{ secrets.PROJECTS_WRITE_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const {report} = require('./.github/scripts/issue-reconciliation-report.cjs');
            await report({github,context,core});
