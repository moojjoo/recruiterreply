name: Issue Reconciliation Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
  workflow_run:
    workflows: ['Build and Deploy to Dev']
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: read
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report merged PRs with open completion issues
        env:
          PROJECTS_WRITE_TOKEN: ${{ secrets.PROJECTS_WRITE_TOKEN }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PROJECTS_WRITE_TOKEN || github.token }}
          script: |
            const {report} = require('./.github/scripts/issue-reconciliation-report.cjs');
            await report({github,context,core});
      - name: Upload reconciliation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: issue-reconciliation-report
          path: reconciliation-report/
          retention-days: 30
