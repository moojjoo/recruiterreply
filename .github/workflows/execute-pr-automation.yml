name: Execute PR Automation

# Runs from the trusted default branch. Never checks out or executes PR code.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened, labeled, converted_to_draft]
  workflow_run:
    workflows: ["Build and Deploy to Dev", "CodeQL", "Playwright Tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default-branch automation
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Prepare execute-dev PRs and enable protected auto-merge
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const prs = context.payload.pull_request
              ? [context.payload.pull_request]
              : (await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100}));
            for (const pr of prs) {
              if (pr.base.ref !== 'main') continue;
              const {data: full} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (full.head.repo.full_name !== owner + '/' + repo) continue;
              const managed = /^((feature|fix|bugfix)\/\d+-|execute\/\d+-)/.test(full.head.ref) || /(?:^|\s)\/(?:execute)\s+\d+/.test(full.body || '');
              const labeled = full.labels.some(l => l.name === 'execute-dev');
              if (!labeled && !managed) continue;
              if (!labeled) {
                await github.rest.issues.addLabels({owner, repo, issue_number: full.number, labels: ['execute-dev']});
                core.notice('PR #' + full.number + ': applied execute-dev label');
              }
              const {validateReadiness, classifyRisk} = require('./.github/scripts/pr-readiness.cjs');
              const {issueNumberFromPullRequest, ensureIssueLink} = require('./.github/scripts/pr-issue-linking.cjs');
              const linkedIssue = issueNumberFromPullRequest(full);
              if (linkedIssue) {
                const linkedBody = ensureIssueLink(full.body || '', linkedIssue);
                if (linkedBody !== (full.body || '')) {
                  await github.rest.pulls.update({owner, repo, pull_number: full.number, body: linkedBody});
                  full.body = linkedBody;
                  core.notice('PR #' + full.number + ': added guarded issue link for #' + linkedIssue);
                }
              }
              const {data: checkResponse} = await github.rest.checks.listForRef({owner, repo, ref: full.head.sha, per_page: 100});
              const {data: reviews} = await github.rest.pulls.listReviews({owner, repo, pull_number: pr.number, per_page: 100});
              const q = await github.graphql(`query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner,name:$repo) { pullRequest(number:$number) {
                  id reviewThreads(first:100) { nodes { isResolved isOutdated } }
                } } }`, {owner, repo, number:pr.number});
              const item = q.repository.pullRequest;
              const dependencyRefs = [...(full.body || '').matchAll(/(?:depends on|blocked by)\\s+#(\\d+)/gi)].map(m => Number(m[1]));
              let dependenciesMerged = true;
              for (const number of dependencyRefs) {
                const {data: dep} = await github.rest.pulls.get({owner, repo, pull_number:number});
                if (!dep.merged) dependenciesMerged = false;
              }
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
              const risk = classifyRisk(changedFiles);
              // A label must never lower the risk tier or bypass required checks.
              // Trusted automation may label only low/medium PRs with a complete evidence checklist.
              const hasEvidence = /^## Implementation evidence\\s*\\n[\\s\\S]*?\\b(?:commit|test|verification|workflow)\\b/im.test(full.body || '');
              const hasCompleteCriteria = /^## Acceptance criteria\\s*\\n(?:[\\s\\S]*?\\n)?\\s*[-*]\\s*\\[[xX]\\]/im.test(full.body || '') && !/^\\s*[-*]\\s*\\[ \\]/m.test(full.body || '');
              if (risk !== 'high' && hasEvidence && hasCompleteCriteria && !full.labels.some(l => l.name === 'automation-ready')) {
                await github.rest.issues.addLabels({owner, repo, issue_number: full.number, labels: ['automation-ready']});
                full.labels.push({name: 'automation-ready'});
              }
              const result = validateReadiness({
                pr:full, checks:checkResponse.check_runs, reviews,
                changedFiles,
                threads:item.reviewThreads.nodes, dependenciesMerged
              });
              if (!result.eligible) {
                const remediation = require('./.github/scripts/ci-remediation-comment.cjs');
                if (context.eventName === 'workflow_run' && context.payload.workflow_run?.conclusion === 'failure') {
                  await remediation.report({github, context: {...context, repo: {owner, repo}, payload: {pull_request: full}}, core});
                }
                core.notice('PR #' + full.number + ' (' + result.risk + ' risk): blocked: ' + result.reasons.join('; '));
                continue;
              }
              // GitHub branch protection and required checks still govern the merge.
              try {
                await github.graphql(`mutation($id:ID!) {
                  enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}) { clientMutationId }
                }`, {id:item.id});
                core.notice('Enabled GitHub protected auto-merge for PR #' + pr.number + ' (' + result.risk + ' risk)');
              } catch (e) {
                core.warning('Auto-merge unavailable for PR #' + pr.number + ': ' + e.message);
              }
            }
